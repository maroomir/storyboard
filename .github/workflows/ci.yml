name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 같은 브랜치에 연달아 push하면 앞선 실행은 취소한다. 마지막 커밋의 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The desktop tests drive main without Electron, so the ~100 MB binary is not needed here.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 세 검사를 한 스텝에 묶지 않는다. 무엇이 깨졌는지 체크 목록에서 바로 보이게 한다.
      - name: Compile
        run: npm run compile

      # `compile` only covers the extension host. Bundling both apps is what catches a change
      # that typechecks but cannot be built.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
