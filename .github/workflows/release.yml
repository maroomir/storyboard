name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# 릴리즈를 draft 로 먼저 만들고, 모든 자산이 모인 뒤에야 공개한다.
jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches the monorepo version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$root_version"
          node scripts/sync-version.mjs --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Assets are still uploading."

  # The build verification test: what lint and the unit tests cannot see. It runs between the
  # checks on the source and the jobs that build what ships, so a failure here leaves the release
  # in draft with nothing uploaded. The diff contracts need the previous tag, hence the full clone.
  bvt:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diff contracts
        run: npm run bvt:contracts

      - name: Impact map
        run: npm run bvt:impact

      - name: Golden workspaces
        run: npm run bvt:golden

      # The same packaging steps `publish` runs; the smoke installs and runs what they produced.
      - name: Package the extension and the CLI
        run: |
          scripts/package-release.sh "${GITHUB_REF_NAME#v}" release
          (cd release && shasum -a 256 storyboard-* install.sh > SHA256SUMS)

      - name: Artifact smoke
        run: scripts/bvt/smoke.sh release "${GITHUB_REF_NAME#v}"

  publish:
    needs: bvt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package the extension and the CLI
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}" release

      - name: Create checksum
        working-directory: release
        run: shasum -a 256 storyboard-* install.sh > SHA256SUMS

      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v ver="$version" '
              $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' "$1"
          }
          korean="$(section CHANGELOG.md)"
          english="$(section CHANGELOG.en.md)"
          if [ -z "$(printf '%s' "$korean" | tr -d '[:space:]')" ]; then
            echo "No [$version] section in CHANGELOG.md" >&2
            exit 1
          fi
          {
            printf '%s\n' "$korean"
            printf '<details>\n<summary>English</summary>\n\n%s\n</details>\n' "$english"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/storyboard-vscode-*.vsix \
            release/storyboard-cli-*.tar.gz \
            release/install.sh \
            release/SHA256SUMS \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --notes-file release-notes.md

