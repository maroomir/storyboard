name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# 설치본은 Actions 아티팩트를 거치지 않고 릴리즈에 직접 올라간다. 아티팩트 저장소는 계정 공유
# 용량에 산입되지만 릴리즈 자산은 그렇지 않아, 회당 수백 MB를 과금 버킷으로 나르지 않으려는 것이다.
# 그래서 릴리즈를 draft 로 먼저 만들고, 모든 자산이 모인 뒤에야 공개한다.
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches the monorepo version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$root_version"
          node scripts/sync-version.mjs --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Assets are still uploading."

  # The build verification test: what lint and the unit tests cannot see. It runs between the
  # checks on the source and the jobs that build what ships, so a failure here leaves the release
  # in draft with nothing uploaded. The diff contracts need the previous tag, hence the full clone.
  bvt:
    needs: verify
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diff contracts
        run: npm run bvt:contracts

      - name: Impact map
        run: npm run bvt:impact

      - name: Golden workspaces
        run: npm run bvt:golden

  # Installers are built on the platform they are for. Signing and notarization switch on only when
  # their secrets exist; without them the installers are unsigned but still ship.
  desktop:
    needs: bvt
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.target }}" = "mac" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            else
              echo "::warning::MAC_CSC_LINK is not set; the macOS app is unsigned and cannot auto-update."
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            fi
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
              echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            fi
          elif [ -n "$WIN_CSC_LINK" ]; then
            echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::WIN_CSC_LINK is not set; the Windows installer is unsigned."
          fi

      - name: Package the installers
        run: npm run package:${{ matrix.target }} --workspace @storyboard/desktop

      - name: Upload the installers and the update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            apps/desktop/release/storyboard-desktop-* \
            apps/desktop/release/latest*.yml \
            --clobber

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package the extension and the CLI
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          npm run package:vsix --workspace storyboard-vscode -- --out "$PWD/release/storyboard-vscode-${version}.vsix"
          npm run build --workspace @storyboard/cli
          scripts/package-tarballs.sh "$version" release
          cp scripts/install.sh release/install.sh

      - name: Collect the desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'storyboard-desktop-*' \
            --pattern 'latest*.yml' \
            --dir release
          ls -la release

      - name: Create checksum
        working-directory: release
        run: shasum -a 256 storyboard-* install.sh > SHA256SUMS

      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v ver="$version" '
              $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' "$1"
          }
          korean="$(section CHANGELOG.md)"
          english="$(section CHANGELOG.en.md)"
          if [ -z "$(printf '%s' "$korean" | tr -d '[:space:]')" ]; then
            echo "No [$version] section in CHANGELOG.md" >&2
            exit 1
          fi
          {
            printf '%s\n' "$korean"
            printf '<details>\n<summary>English</summary>\n\n%s\n</details>\n' "$english"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/storyboard-vscode-*.vsix \
            release/storyboard-cli-*.tar.gz \
            release/install.sh \
            release/SHA256SUMS \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --notes-file release-notes.md

