name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # Installers are built on the platform they are for. Signing and notarization switch on only when
  # their secrets exist; without them the installers are unsigned but still ship.
  desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.target }}" = "mac" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            else
              echo "::warning::MAC_CSC_LINK is not set; the macOS app is unsigned and cannot auto-update."
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            fi
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
              echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            fi
          elif [ -n "$WIN_CSC_LINK" ]; then
            echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::WIN_CSC_LINK is not set; the Windows installer is unsigned."
          fi

      - name: Package the installers
        run: npm run package:${{ matrix.target }} --workspace @storyboard/desktop

      - name: Keep the installers and the update feed
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/storyboard-desktop-*
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    needs: desktop
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches the monorepo version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$root_version"
          node scripts/sync-version.mjs --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package the extension and the CLI
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          npm run package:vsix --workspace storyboard-vscode -- --out "$PWD/release/storyboard-vscode-${version}.vsix"
          npm run build --workspace @storyboard/cli
          scripts/package-tarballs.sh "$version" release
          cp scripts/install.sh release/install.sh

      - name: Collect the desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Create checksum
        working-directory: release
        run: shasum -a 256 storyboard-* install.sh > SHA256SUMS

      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v ver="$version" '
              $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' "$1"
          }
          korean="$(section apps/vscode/CHANGELOG.md)"
          english="$(section apps/vscode/CHANGELOG.en.md)"
          if [ -z "$(printf '%s' "$korean" | tr -d '[:space:]')" ]; then
            echo "No [$version] section in apps/vscode/CHANGELOG.md" >&2
            exit 1
          fi
          {
            printf '%s\n' "$korean"
            printf '<details>\n<summary>English</summary>\n\n%s\n</details>\n' "$english"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            release/storyboard-vscode-*.vsix \
            release/storyboard-cli-*.tar.gz \
            release/storyboard-desktop-* \
            release/latest*.yml \
            release/install.sh \
            release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

      # 공개 저장소 webfic/storyboard 는 소스 없이 문서·릴리즈만 담는다.
      # 토큰이 없으면 사설 릴리즈만 나가고 이 단계는 건너뛴다.
      - name: Publish to the public repository
        env:
          GH_TOKEN: ${{ secrets.WEBFIC_RELEASE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WEBFIC_RELEASE_TOKEN is not set; skipping the public release."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/webfic/storyboard.git" public
          cp apps/vscode/CHANGELOG.md apps/vscode/CHANGELOG.en.md public/
          cp scripts/install.sh public/install.sh
          cd public
          git config user.name "Maroomir Yoon"
          git config user.email "maroomir@gmail.com"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add CHANGELOG.md CHANGELOG.en.md install.sh
            git commit -m "chore: release $GITHUB_REF_NAME"
          fi
          git tag -f "$GITHUB_REF_NAME"
          git push origin HEAD:main
          git push -f origin "$GITHUB_REF_NAME"
          gh release delete "$GITHUB_REF_NAME" --repo webfic/storyboard --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" --repo webfic/storyboard \
            ../release/storyboard-vscode-*.vsix \
            ../release/storyboard-cli-*.tar.gz \
            ../release/storyboard-desktop-* \
            ../release/latest*.yml \
            ../release/install.sh \
            ../release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file ../release-notes.md
