name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches the monorepo version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$root_version"
          node scripts/sync-version.mjs --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package the three artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          npm run package:vsix --workspace storyboard-vscode -- --out "$PWD/release/storyboard-vscode-${version}.vsix"
          npm run build --workspace @storyboard/bot
          npm run build --workspace @storyboard/cli
          scripts/package-tarballs.sh "$version" release
          cp scripts/install.sh release/install.sh

      - name: Create checksum
        working-directory: release
        run: shasum -a 256 storyboard-* install.sh > SHA256SUMS

      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v ver="$version" '
              $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' "$1"
          }
          korean="$(section apps/vscode/CHANGELOG.md)"
          english="$(section apps/vscode/CHANGELOG.en.md)"
          if [ -z "$(printf '%s' "$korean" | tr -d '[:space:]')" ]; then
            echo "No [$version] section in apps/vscode/CHANGELOG.md" >&2
            exit 1
          fi
          {
            printf '%s\n' "$korean"
            printf '<details>\n<summary>English</summary>\n\n%s\n</details>\n' "$english"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            release/storyboard-vscode-*.vsix \
            release/storyboard-bot-*.tar.gz \
            release/storyboard-cli-*.tar.gz \
            release/install.sh \
            release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
