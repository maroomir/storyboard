<svg xmlns="http://www.w3.org/2000/svg" style="background:#fffdf9;font-family:IBM Plex Sans KR, Apple SD Gothic Neo, system-ui, sans-serif" viewBox="0 0 1240 560" role="img" aria-label="씬 파이프라인: 전처리(grounding, beats) 뒤 인물 기억·배경 묘사·말투 표본이 뼈대에 합쳐지고, 뼈대가 대사 다듬기와 살붙임을 거쳐 화자 붙이기로 초안이 되며, 되먹임 루프가 연속성 검사와 비평을 돌려 재작성한다">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#221f1a"/></marker>
  </defs>
  <g font-size="12" fill="#221f1a">
    <!-- input column -->
    <rect x="20" y="30" width="200" height="190" rx="4" fill="#ebf0dc" stroke="#6a7f2f" stroke-width="1.5"/>
    <text x="32" y="50" font-weight="600" font-size="13">입력(프롬프트에 실리는 것)</text>
    <text x="32" y="72" font-size="11">· scene/NNN.card: 의도·비트·근거</text>
    <text x="32" y="88" font-size="11">· 등장 인물·배경 카드</text>
    <text x="32" y="104" font-size="11">· bible/canon.md 사실 줄</text>
    <text x="32" y="120" font-size="11">· story-state.md 원장</text>
    <text x="32" y="136" font-size="11">   (목격자 필터 적용)</text>
    <text x="32" y="152" font-size="11">· 직전 씬 꼬리 + 장 요약</text>
    <text x="32" y="168" font-size="11">· 서술자 카드·시점·줄기</text>
    <text x="32" y="184" font-size="11">· project 문체·장르·품질 기준</text>
    <text x="32" y="200" font-size="11">· craft contract(금지·밀도 규칙)</text>

    <!-- preprocess -->
    <rect x="20" y="250" width="200" height="110" rx="4" fill="#e3eef6" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="32" y="270" font-weight="600" font-size="13">전처리: 카드 빈칸 채우기</text>
    <text x="32" y="290" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">sceneGrounding (0.7)</text>
    <text x="44" y="306" font-size="11" fill="#6b655a">장소·시간·동기 제안, 승인 후 저장</text>
    <text x="32" y="326" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">sceneBeats (0.7)</text>
    <text x="44" y="342" font-size="11" fill="#6b655a">비트 없으면 제안해 카드에 씀</text>
    <path d="M120 250 V 222" fill="none" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>

    <!-- stage 1-3 -->
    <line x1="220" y1="125" x2="262" y2="125" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <g>
      <rect x="266" y="30" width="200" height="60" rx="4" fill="#ebf0dc" stroke="#6a7f2f" stroke-width="1.5"/>
      <text x="278" y="50" font-weight="600" font-size="13">1 buildPersonas 인물 기억</text>
      <text x="278" y="68" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">personaGeneration (0.7)</text>
      <text x="278" y="82" font-size="10" fill="#6b655a">인물마다 1회, 카드별 캐시</text>
    </g>
    <g>
      <rect x="266" y="100" width="200" height="60" rx="4" fill="#ebf0dc" stroke="#6a7f2f" stroke-width="1.5"/>
      <text x="278" y="120" font-weight="600" font-size="13">2 describeBackground</text>
      <text x="278" y="138" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">backgroundDescription (0.7)</text>
      <text x="278" y="152" font-size="10" fill="#6b655a">배경 카드마다, 직전 발췌 있으면 생략</text>
    </g>
    <g>
      <rect x="266" y="170" width="200" height="60" rx="4" fill="#ebf0dc" stroke="#6a7f2f" stroke-width="1.5" stroke-dasharray="5 3"/>
      <text x="278" y="190" font-weight="600" font-size="13">3 collectVoiceSamples</text>
      <text x="278" y="208" font-size="11">AI 호출 없음: 앞 초안에서</text>
      <text x="278" y="222" font-size="10" fill="#6b655a">인물별 대사 표본을 뽑아 둠</text>
    </g>
    <!-- merge into skeleton -->
    <path d="M466 60 H 500 V 130" fill="none" stroke="#221f1a" stroke-width="1.5"/>
    <path d="M466 130 H 500" fill="none" stroke="#221f1a" stroke-width="1.5"/>
    <path d="M466 200 H 500 V 130" fill="none" stroke="#221f1a" stroke-width="1.5"/>
    <line x1="500" y1="130" x2="536" y2="130" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>

    <!-- skeleton -->
    <g>
      <rect x="540" y="70" width="220" height="120" rx="4" fill="#f8e6dc" stroke="#b4532a" stroke-width="2.5"/>
      <text x="552" y="92" font-weight="600" font-size="13">4 draftSkeleton 뼈대</text>
      <text x="552" y="112" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">sceneSkeleton (0.7)</text>
      <text x="552" y="132" font-size="11">비트를 따라 씬 전체를 목표 분량의</text>
      <text x="552" y="148" font-size="11">일부로 먼저 씀. 가장 비싼 호출.</text>
      <text x="552" y="170" font-size="10" fill="#6b655a">코드 검증 실패 시 사유를 붙여 1회 재호출</text>
    </g>

    <!-- polish -->
    <line x1="760" y1="100" x2="802" y2="100" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <g>
      <rect x="806" y="30" width="200" height="90" rx="4" fill="#f8e6dc" stroke="#b4532a" stroke-width="1.5"/>
      <text x="818" y="50" font-weight="600" font-size="13">5 polishDialogue 대사 다듬기</text>
      <text x="818" y="68" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">sceneDialoguePolish (0.8)</text>
      <text x="818" y="86" font-size="10" fill="#6b655a">말투 표본·카드 보이스로 대사만 고침</text>
      <text x="818" y="102" font-size="10" fill="#6b655a">선택 단계: 실패하면 뼈대 그대로</text>
    </g>
    <!-- expand -->
    <line x1="760" y1="160" x2="802" y2="160" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M906 120 V 140" fill="none" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <g>
      <rect x="806" y="140" width="200" height="110" rx="4" fill="#f8e6dc" stroke="#b4532a" stroke-width="2.5"/>
      <text x="818" y="160" font-weight="600" font-size="13">6 expandSection 살붙임</text>
      <text x="818" y="178" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">sceneSectionExpansion (0.75)</text>
      <text x="818" y="196" font-size="11">뼈대를 구간으로 자르고 구간마다</text>
      <text x="818" y="212" font-size="11">앞 구간을 보여 주며 목표 길이로 확장</text>
      <text x="818" y="232" font-size="10" fill="#6b655a">구간×(1+재시도) 회 호출, 중복·탈락 검증</text>
    </g>
    <!-- attribute -->
    <line x1="1006" y1="195" x2="1048" y2="195" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <g>
      <rect x="1052" y="140" width="170" height="110" rx="4" fill="#f8e6dc" stroke="#b4532a" stroke-width="1.5"/>
      <text x="1064" y="160" font-weight="600" font-size="13">7 attributeDialogue</text>
      <text x="1064" y="178" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="9">sceneDialogueAttribution (0)</text>
      <text x="1064" y="196" font-size="11">대사마다 화자를 붙여</text>
      <text x="1064" y="212" font-size="11">대사 기록을 남김</text>
      <text x="1064" y="232" font-size="10" fill="#6b655a">→ dialogue 기록(다음 씬 말투 표본)</text>
    </g>

    <!-- output draft -->
    <path d="M1137 250 V 290" fill="none" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="1052" y="294" width="170" height="44" rx="4" fill="#fffdf9" stroke="#221f1a" stroke-width="1.5"/>
    <text x="1137" y="313" font-weight="600" font-size="13" text-anchor="middle">draft/NNN-*.md</text>
    <text x="1137" y="329" font-size="10" fill="#6b655a" text-anchor="middle">+ cache(입력 해시, 제공자)</text>

    <!-- revise loop -->
    <path d="M1052 316 H 1010" fill="none" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="540" y="280" width="466" height="150" rx="4" fill="#ede4f5" stroke="#7a4f9d" stroke-width="2"/>
    <text x="552" y="302" font-weight="600" font-size="13">되먹임 루프 drafts.revise (설정 revise.maxIterations 회까지)</text>
    <rect x="552" y="314" width="200" height="62" rx="3" fill="#fffdf9" stroke="#7a4f9d" stroke-width="1"/>
    <text x="562" y="332" font-weight="600" font-size="12">검사 (둘을 동시에)</text>
    <text x="562" y="348" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">continuityCheck (0.1)</text>
    <text x="562" y="364" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">draftCritique (0.2)</text>
    <line x1="752" y1="345" x2="790" y2="345" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="771" y="337" font-size="9" fill="#6b655a" text-anchor="middle">라우팅</text>
    <rect x="794" y="314" width="200" height="62" rx="3" fill="#fffdf9" stroke="#7a4f9d" stroke-width="1"/>
    <text x="804" y="332" font-weight="600" font-size="12">재작성 (담당별 패스)</text>
    <text x="804" y="348" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="11">draftRevision (0.7)</text>
    <text x="804" y="364" font-size="10" fill="#6b655a">canon·persona·narrator·setting 묶음순</text>
    <path d="M894 376 V 396 H 652 V 380" fill="none" stroke="#7a4f9d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a2)"/>
    <text x="773" y="412" font-size="10" fill="#7a4f9d" text-anchor="middle">high 지적이 남아 있고 회수가 남았으면 다시 검사</text>
    <text x="552" y="426" font-size="10" fill="#6b655a">멈춤: high 0건 · 회수 소진 · 분량이 maxCompressionPercent 넘게 줄면 원본 보존(rejection)</text>

    <!-- after-run strip -->
    <path d="M773 430 V 462" fill="none" stroke="#221f1a" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="266" y="466" width="956" height="74" rx="4" fill="#f3edd8" stroke="#8a7a3c" stroke-width="1.5"/>
    <text x="278" y="486" font-weight="600" font-size="13">씬 저장 직후 → 3층 (작품 기억 갱신)</text>
    <text x="278" y="506" font-size="11">동기: <tspan font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace">storyStateUpdate</tspan> 가 원장에 새 사실을 목격자와 함께 덧붙임 (다음 씬이 읽으므로 기다림)</text>
    <text x="278" y="524" font-size="11">백그라운드: 인물 성향·정전 후보·카드 후보·배경 인물 추출은 큐에 넣고 다음 씬으로 넘어감</text>
    <path d="M266 503 H 236 V 130 H 226" fill="none" stroke="#8a7a3c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a2)"/>
    <text x="246" y="420" font-size="10" fill="#8a7a3c" text-anchor="middle" transform="rotate(-90 246 420)">다음 씬의 입력으로</text>
  </g>
</svg>
